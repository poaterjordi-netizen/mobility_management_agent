# Include this block inside the existing HTTPS server for metro.9m-zx.com.
# The trailing slash on proxy_pass intentionally removes the /mobility/ prefix.
location = /mobility {
    auth_basic off;
    return 308 /mobility/;
}

location = /mobility/health {
    auth_basic off;
    limit_except GET { deny all; }
    limit_req zone=mobility_public burst=10 nodelay;
    limit_conn mobility_public_conn 10;
    proxy_pass http://127.0.0.1:18082/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}

location /mobility/api/ {
    auth_basic off;
    limit_except GET POST { deny all; }
    limit_req zone=mobility_public burst=20 nodelay;
    limit_conn mobility_public_conn 20;
    client_max_body_size 32k;
    rewrite ^/mobility(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:18082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}

location /mobility/ {
    auth_basic off;
    limit_except GET { deny all; }
    limit_req zone=mobility_public burst=30 nodelay;
    limit_conn mobility_public_conn 20;
    proxy_pass http://127.0.0.1:18081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
